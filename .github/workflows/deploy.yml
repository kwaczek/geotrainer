name: Test and Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Run Tests with Coverage
        run: |
          cd server
          npm run test:coverage

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage
          if-no-files-found: warn

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo SSH connection successful"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          # Try up to 3 times with increasing delay between attempts
          npm_retry_count=0
          npm_max_retries=3
          until [ $npm_retry_count -ge $npm_max_retries ]
          do
            npm run install:all && break
            npm_retry_count=$((npm_retry_count+1))
            echo "npm install attempt $npm_retry_count failed, retrying in 10 seconds..."
            sleep 10
          done
          if [ $npm_retry_count -ge $npm_max_retries ]; then
            echo "npm install failed after $npm_max_retries attempts"
            exit 1
          fi

      - name: Build application
        run: |
          # Disable treating warnings as errors in CI
          export CI=false
          # Build the client with environment variables
          cd client && REACT_APP_ADMIN_USERNAME=${{ secrets.REACT_APP_ADMIN_USERNAME }} REACT_APP_ADMIN_PASSWORD=${{ secrets.REACT_APP_ADMIN_PASSWORD }} REACT_APP_ADMIN_API_KEY=${{ secrets.REACT_APP_ADMIN_API_KEY }} npm run build && cd ..
          # Build the server
          cd server && npm run build && cd ..

      - name: Deploy to EC2
        run: |
          rsync -avz --exclude 'node_modules' --exclude '.git' ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/geotrainer/
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/geotrainer
            npm run install:all
            # Seed the database with the latest data
            cd server && npm run seed:all && cd ..
            pm2 stop geotrainer || true
            pm2 delete geotrainer || true
            NODE_ENV=production ADMIN_API_KEY="${{ secrets.REACT_APP_ADMIN_API_KEY }}" pm2 start server/dist/index.js --name "geotrainer"
            pm2 save
          EOF
